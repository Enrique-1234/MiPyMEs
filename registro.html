<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear cuenta — ReservaPro</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/animation.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div class="auth-page">
    <aside class="auth-visual" aria-hidden="true" style="background: linear-gradient(135deg, #0f172a, #4f46e5, #06b6d4);">
      <div class="auth-visual-content">
        <a href="index.html" class="logo" style="color:#fff;">
          <span class="logo-mark" style="background: rgba(255,255,255,.2);">R</span>
          <span>ReservaPro</span>
        </a>
        <div>
          <h2>Crea tu cuenta</h2>
          <p>Empieza gratis. Sin tarjeta de crédito. Configura tu negocio en minutos y comienza a recibir reservas.</p>
        </div>
        <p style="font-size:.8125rem; opacity:.7;">© 2025 ReservaPro</p>
      </div>
    </aside>

    <main class="auth-form-wrapper">
      <div class="auth-form page-transition">
        <div class="auth-header">
          <h1>Crear cuenta</h1>
          <p>Completa tus datos para empezar a gestionar tus reservas.</p>
        </div>

        <form id="registerForm" novalidate>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:.75rem;">
            <div class="form-group">
              <label for="nombre" class="form-label">Nombre <span class="required">*</span></label>
              <input type="text" id="nombre" class="form-input" placeholder="Juan" required autocomplete="given-name" />
              <span class="form-helper" id="nombreHelper"></span>
            </div>
            <div class="form-group">
              <label for="apellido" class="form-label">Apellido <span class="required">*</span></label>
              <input type="text" id="apellido" class="form-input" placeholder="Pérez" required autocomplete="family-name" />
              <span class="form-helper" id="apellidoHelper"></span>
            </div>
          </div>

          <div class="form-group">
            <label for="email" class="form-label">Correo electrónico <span class="required">*</span></label>
            <input type="email" id="email" class="form-input" placeholder="tu@email.com" required autocomplete="email" />
            <span class="form-helper" id="emailHelper"></span>
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Contraseña <span class="required">*</span></label>
            <input type="password" id="password" class="form-input" placeholder="Mínimo 8 caracteres" required autocomplete="new-password" />
            <span class="form-helper" id="passwordHelper"></span>
          </div>

          <div class="form-group">
            <label for="tipoNegocio" class="form-label">Tipo de negocio <span class="required">*</span></label>
            <select id="tipoNegocio" class="form-select" required>
              <option value="">Selecciona una opción</option>
              <option value="barberia">Barbería / Estética</option>
              <option value="eventos">Salón de Eventos</option>
              <option value="iglesia">Iglesia / Comunidad</option>
              <option value="restaurante">Restaurante</option>
            </select>
            <span class="form-helper" id="tipoHelper"></span>
          </div>

          <div class="form-group">
            <label class="form-checkbox">
              <input type="checkbox" id="terminos" required />
              <span>Acepto los <a href="#" style="color: var(--color-primary);">términos y condiciones</a> y la <a href="#" style="color: var(--color-primary);">política de privacidad</a>.</span>
            </label>
            <span class="form-helper" id="terminosHelper"></span>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg" id="registerBtn">
            <span class="btn-text">Crear cuenta gratis</span>
          </button>
        </form>

        <p class="auth-footer">
          ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
        </p>
      </div>
    </main>
  </div>

  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <script src="js/main.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/animations.js"></script>
</body>
</html>
