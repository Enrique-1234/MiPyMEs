<!DOCTYPE html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AlPunto — Nicolás Romero</title>

    <style>
      /* Fondo por defecto antes de React (evita flash blanco/negro) */
      html { background-color: #0A0A0A; }
      html[data-theme="light"] { background-color: #FFFFFF; }
      body { margin: 0; }
    </style>

    <script>
      // Anti-FOUC: aplica el tema guardado ANTES de que React monte
      (function () {
        try {
          var theme = localStorage.getItem('alpunto-theme');
          if (theme === 'light' || theme === 'dark') {
            document.documentElement.setAttribute('data-theme', theme);
          } else if (
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: light)').matches
          ) {
            document.documentElement.setAttribute('data-theme', 'light');
          }
          // Si no hay preferencia y el SO está en dark, dejamos 'dark' (ya está en el HTML)
        } catch (e) {
          // Si localStorage falla (modo incógnito restrictivo), no pasa nada
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
